[project]
name = "langgraph-agent"
version = "0.1.0"
description = "LangGraph Schritt für Schritt: ein Rechenagent als deutsches Jupyter-Notebook"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
    "python-dotenv>=1.0,<2",
    "jupyterlab>=4.0,<5",
    "ipykernel>=7.0,<8",
    "graphviz>=0.20,<1",
]

[dependency-groups]
dev = [
    "nbformat>=5.10,<6",
    "nbconvert>=7.0,<8",
    "pytest>=8.0,<10",
]
